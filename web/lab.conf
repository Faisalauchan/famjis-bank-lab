# Allow .htaccess rewrites for the API
<Directory /var/www/html>
    AllowOverride All
</Directory>

# Deliberately insecure: execute PHP in the uploads directory, and match the
# .php token ANYWHERE in the filename (no trailing $), so shell.php.jpg runs.
<Directory /var/www/html/uploads>
    <FilesMatch "\.(php|phtml|php3|php4|php5|php7)">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>

# ensure the Authorization header reaches PHP (Apache strips it otherwise)
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
