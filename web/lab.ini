; Lab settings: session cookie readable by JavaScript (enables the XSS task),
; errors shown to make exploitation feedback visible.
session.cookie_httponly = 0
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
session.gc_maxlifetime = 86400
