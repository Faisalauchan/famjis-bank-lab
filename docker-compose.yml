services:
  web:
    build: ./web
    environment:
      # each student runs with their own matric number -> unique flags
      STUDENT_ID: "${STUDENT_ID:-DEMO}"
      SECRET_SALT: "icdfa_int406_salt_change_me"
      ADMIN_PASS: "S3cretAdmin_pw!"      # used by the bot; students never see it
    ports:
      # host port is configurable (default 8081, since Burp's proxy usually
      # holds 8080); override with WEB_PORT if you want a different one.
      - "${WEB_PORT:-8081}:80"
    volumes:
      - labdata:/var/www/data

  adminbot:
    build: ./adminbot
    # Run the bot on the host network so the "victim" browser sees the host
    # exactly as any machine on the LAN would: a stolen-cookie beacon in an XSS
    # payload can target the attacker's real IP:PORT listener (e.g.
    # http://192.168.x.y:9000/...) — a realistic exfil, no docker.internal alias.
    # On the host network the compose service name "web" no longer resolves, so
    # the bot reaches the bank through its published host port instead.
    network_mode: "host"
    environment:
      TARGET: "http://localhost:${WEB_PORT:-8081}"
      ADMIN_USER: "admin"
      ADMIN_PASS: "S3cretAdmin_pw!"
      INTERVAL_MS: "30000"
    depends_on:
      - web

volumes:
  labdata:
